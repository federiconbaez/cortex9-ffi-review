[package]
name = "ffi-review"
version = "0.1.0"
edition = "2021"
description = "Per-boundary review report of unsafe/FFI code in Rust crates, with generated tests for miri/ASan"
license = "Apache-2.0"

[dependencies]
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
exclude = ["examples/demo-ffi"]
